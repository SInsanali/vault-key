name: Release

# A tag such as v0.9.0 builds the program, the installer and the portable zip, checks the
# installer on the runner (a fresh install, and an upgrade over the last release), and publishes a GitHub Release with notes from CHANGELOG.md.
# "Run workflow" does everything except publish: the files are kept as a workflow artifact.
#
# Building runs with a read-only token that is not left on disk, so nothing the build runs
# (build scripts of dependencies, the tests) can change the repository or the release. Only
# the publish job, which runs no project code, can write. Actions are pinned by commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  INNO_SETUP_VERSION: "7.1.1"
  INNO_SETUP_SHA256: "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - name: Version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $line = Get-Content Cargo.toml | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1
          $version = [regex]::Match($line, '"([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Cargo.toml's version '$version' is not a plain version number." }
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$version") {
            throw "The tag $($env:REF_NAME) does not match version $version in Cargo.toml."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the program
        shell: pwsh
        run: |
          cargo build --release --locked -p vault-key
          # The window needs WebView2Loader.dll beside the program. The build unpacks one.
          # Cargo 1.100 and later keep build-script output in build\<crate>\<hash>, earlier ones
          # in build\<crate>-<hash>.
          $loader = Get-ChildItem -ErrorAction SilentlyContinue `
            target\release\build\webview2-com-sys\*\out\x64\WebView2Loader.dll,
            target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $loader) { throw "WebView2Loader.dll was not found under target\release\build." }
          Copy-Item $loader.FullName target\release\

      # Code signing is off until these secrets exist. Without a signature, Windows
      # SmartScreen warns the first time the installer runs (the README says so).
      # Not yet tried: check the action's current inputs before switching it on.
      - name: Sign the program
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_SETUP_VERSION -replace '\.', '_')/innosetup-$env:INNO_SETUP_VERSION-x64.exe" -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SETUP_SHA256) { throw "The Inno Setup download does not match its checksum." }
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/NOICONS", "/DIR=$dir" -Wait
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Installer and portable zip
        shell: pwsh
        run: packaging\package.ps1 -ExeDir target\release -OutDir dist\release -Iscc $env:ISCC

      - name: Sign the installer
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: dist\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Checksums after signing
        if: env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        shell: pwsh
        run: |
          $sums = Get-ChildItem dist\release -Include *.exe, *.zip -Recurse | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [System.IO.File]::WriteAllText("dist\release\SHA256SUMS.txt", (($sums -join "`n") + "`n"))

      - name: Check the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging\installer-check.ps1 -Setup "dist\release\VaultKey-Setup-$($env:VERSION).exe" -Version $env:VERSION -DeleteData

      # An update installed over the last published version keeps the user's settings and
      # backups. (A tag's own release is not published yet, so "latest" is the one before.)
      - name: Check an upgrade from the last release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $old = Join-Path $env:RUNNER_TEMP "last-release"
          gh release download --repo $env:REPO --pattern "VaultKey-Setup-*.exe" --pattern "SHA256SUMS.txt" --dir $old
          if ($LASTEXITCODE -ne 0) { throw "Could not download the last release's installer." }
          $setup = Get-ChildItem $old -Filter "VaultKey-Setup-*.exe" | Select-Object -First 1
          $line = Get-Content (Join-Path $old "SHA256SUMS.txt") | Where-Object { $_ -match ("  " + [regex]::Escape($setup.Name) + "$") }
          $expected = if ($line) { ($line -split '\s+')[0] } else { "" }
          if ((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "$($setup.Name) does not match the last release's SHA256SUMS.txt." }
          packaging\upgrade-check.ps1 -OldSetup $setup.FullName -NewSetup "dist\release\VaultKey-Setup-$($env:VERSION).exe" -Version $env:VERSION

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          # The notes are this version's section of CHANGELOG.md.
          $notes = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($inside) { break }
              $inside = $line -match ("^## " + [regex]::Escape($version) + "\b")
              continue
            }
            if ($inside) { $notes.Add($line) }
          }
          # Needed only to publish; a "Run workflow" build may come before the notes are written.
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $notes.Count -eq 0) { throw "CHANGELOG.md has no section for $version." }
          if ($notes.Count -eq 0) { $notes.Add("No notes for $version yet.") }
          New-Item -ItemType Directory -Force dist\notes | Out-Null
          $notes -join "`n" | Set-Content dist\notes\release-notes.md -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VaultKey-${{ steps.version.outputs.version }}
          path: dist/release/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: dist/notes/release-notes.md
          if-no-files-found: error

  # Publishing: the only job that can write, and it runs nothing from the repository.
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: VaultKey-${{ needs.build.outputs.version }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$TAG" release/* --repo "$REPO" --title "Vault Key $VERSION" --notes-file notes/release-notes.md --verify-tag
